name: Probe Dobby
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r25c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Clone and inspect Dobby
        run: |
          git clone https://github.com/jmpews/Dobby.git dobby-src
          cd dobby-src
          echo "=== tags ==="
          git tag | tail -30
          echo "=== latest commit ==="
          git log -1 --oneline
          echo "=== CMakeLists.txt top 60 lines ==="
          head -60 CMakeLists.txt
          echo "=== cmake directory ==="
          ls -la cmake/ 2>/dev/null || echo "no cmake dir"
          echo "=== Android.mk? ==="
          find . -maxdepth 2 -name "Android.mk" -o -name "*.gradle" | head -10

      - name: Configure Dobby verbose
        run: |
          cd dobby-src
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -100

      - name: Inspect generated build files
        run: |
          cd dobby-src/build
          echo "=== Makefile targets ==="
          grep -E "^[a-zA-Z_][a-zA-Z0-9_]*:" Makefile 2>/dev/null | head -30
          echo "=== cmake targets ==="
          find . -name "*.cmake" | head -20
          echo "=== try make dry run ==="
          make -n 2>&1 | head -60
