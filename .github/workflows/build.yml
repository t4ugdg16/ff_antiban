name: Build ff_antiban
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r25c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Download prebuilt Dobby
        run: |
          set -e
          mkdir -p dobby/include
          cd /tmp

          # Thử lần lượt các nguồn prebuilt
          OK=0

          # Nguồn 1: repo Android-Dobby có sẵn libdobby.a cho arm64
          if [ "$OK" = "0" ]; then
            echo "=== trying source 1: Android-Dobby ==="
            git clone --depth 1 https://github.com/leanflutter/dobby.git /tmp/dobby-src 2>/dev/null || true
            if [ -d /tmp/dobby-src ]; then
              find /tmp/dobby-src -name "libdobby*.a" -print
              find /tmp/dobby-src -name "dobby.h" -print
            fi
          fi

          # Nguồn 2: tải release asset từ jmpews/Dobby
          if [ "$OK" = "0" ]; then
            echo "=== trying source 2: jmpews releases ==="
            curl -sL "https://api.github.com/repos/jmpews/Dobby/releases" | head -100 || true
          fi

          echo "=== done probing ==="
          ls -la /tmp/dobby-src 2>/dev/null || true

      - name: Fallback — build Dobby with cmake options fix
        run: |
          set -e
          git clone --depth 1 https://github.com/jmpews/Dobby.git dobby-src
          cd dobby-src
          git submodule update --init --recursive

          # Patch asm
          python3 - <<'PYEOF'
          import glob, re
          files = []
          for pat in ["**/*.S", "**/*.s", "**/*.asm"]:
              files.extend(glob.glob(pat, recursive=True))
          files = sorted(set(files))
          sym_re = re.compile(r'(?:cdecl\()?([A-Za-z_][A-Za-z0-9_]*)(?:\))?@PAGE(?:OFF)?')
          def repl(m):
              sym = m.group(1)
              prefix = ':lo12:' if m.group(0).endswith('OFF') else ':pg_hi21:'
              return prefix + sym
          for f in files:
              with open(f, 'r', errors='ignore') as fh:
                  content = fh.read()
              if '@PAGE' not in content:
                  continue
              new = sym_re.sub(repl, content)
              with open(f, 'w') as fh:
                  fh.write(new)
              print("patched:", f)
          PYEOF

          # Debug: xem repo có gì
          echo "=== source .cpp count ==="
          find source -name "*.cpp" -o -name "*.cc" | wc -l
          echo "=== source dirs ==="
          find source -maxdepth 2 -type d | head -30
          echo "=== auto_source_group macro ==="
          grep -B2 -A 30 "auto_source_group" cmake/Macros.cmake | head -60

          # Config với BUILD_SHARED_LIBS=OFF
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF

          echo "=== dobby_static build.make head ==="
          head -120 CMakeFiles/dobby_static.dir/build.make 2>/dev/null || echo "no build.make"

          echo "=== make dobby_static verbose ==="
          make dobby_static VERBOSE=1 -j4 2>&1 | tail -200 || true

          echo ""
          echo "=== find all .a ==="
          find .. -name "*.a" -print
          echo "=== find all .so ==="
          find .. -name "*.so" -print

      - name: Copy Dobby artifacts
        if: always()
        run: |
          mkdir -p dobby/include
          LIB=$(find dobby-src -name "libdobby*.a" 2>/dev/null | head -n 1)
          if [ -z "$LIB" ]; then
            LIB=$(find /tmp/dobby-src -name "libdobby*.a" 2>/dev/null | head -n 1)
          fi
          if [ -z "$LIB" ]; then
            echo "ERROR: no libdobby.a"
            exit 1
          fi
          cp "$LIB" dobby/libdobby.a

          INC=$(find dobby-src -name "dobby.h" 2>/dev/null | head -n 1)
          if [ -z "$INC" ]; then
            INC=$(find /tmp/dobby-src -name "dobby.h" 2>/dev/null | head -n 1)
          fi
          if [ -z "$INC" ]; then
            echo "ERROR: no dobby.h"
            exit 1
          fi
          cp "$INC" dobby/include/dobby.h

          find dobby -type f -print

      - name: Build ff_antiban.so
        if: always()
        run: |
          chmod +x ./build_antiban.sh
          ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }} ./build_antiban.sh 2>&1 | tail -150 || echo "build failed"

      - name: Verify output
        if: always()
        run: |
          ls -la ff_antiban.so 2>/dev/null || echo "no .so"
          file ff_antiban.so 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ff_antiban-arm64
          path: ff_antiban.so
          if-no-files-found: warn
