name: Build ff_antiban
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r25c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Clone Dobby
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git dobby-src
          cd dobby-src && git rev-parse HEAD

      - name: Patch Dobby asm Apple to GNU
        run: |
          cd dobby-src
          python3 - <<'PYEOF'
          import glob, re
          files = []
          for pat in ["**/*.S", "**/*.s", "**/*.asm"]:
              files.extend(glob.glob(pat, recursive=True))
          files = sorted(set(files))
          sym_re = re.compile(r'(?:cdecl\()?([A-Za-z_][A-Za-z0-9_]*)(?:\))?@PAGE(?:OFF)?')
          def repl(m):
              sym = m.group(1)
              prefix = ':lo12:' if m.group(0).endswith('OFF') else ':pg_hi21:'
              return prefix + sym
          for f in files:
              with open(f, 'r', errors='ignore') as fh:
                  content = fh.read()
              if '@PAGE' not in content:
                  continue
              new = sym_re.sub(repl, content)
              with open(f, 'w') as fh:
                  fh.write(new)
              print("patched:", f)
          PYEOF
          grep -rn "@PAGE\|@PAGEOFF" . && echo "WARN: apple syntax remains" || echo "clean"

      - name: Configure Dobby
        run: |
          cd dobby-src
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_GENERATE_SHARED=OFF \
            2>&1 | tail -80
          echo "=== CMakeCache summary ==="
          grep -iE "BUILD_SHARED|STATIC|DOBBY" CMakeCache.txt | head -40

      - name: Build Dobby arm64
        run: |
          cd dobby-src/build
          make -j4 2>&1 | tail -150

      - name: Locate Dobby outputs
        run: |
          echo "=== all .a ==="
          find dobby-src -name "*.a" -print
          echo "=== all .so ==="
          find dobby-src -name "*.so" -print
          echo "=== dobby.h ==="
          find dobby-src -name "dobby.h" -print
          echo "=== build tree top ==="
          ls -la dobby-src/build/ 2>/dev/null
          echo "=== recent files ==="
          find dobby-src/build -newer dobby-src/CMakeLists.txt -type f -print 2>/dev/null | head -40

      - name: Copy Dobby prebuilt
        run: |
          mkdir -p dobby/include
          LIB=$(find dobby-src -name "libdobby*.a" | head -n 1)
          if [ -z "$LIB" ]; then LIB=$(find dobby-src -name "libdobby*.so" | head -n 1); fi
          if [ -z "$LIB" ]; then echo "ERROR: no dobby library"; exit 1; fi
          echo "picked lib: $LIB"
          cp "$LIB" dobby/
          INC=$(find dobby-src -name "dobby.h" | head -n 1)
          if [ -z "$INC" ]; then echo "ERROR: dobby.h not found"; exit 1; fi
          cp "$INC" dobby/include/dobby.h
          find dobby -type f -print

      - name: Build ff_antiban.so
        run: |
          chmod +x ./build_antiban.sh
          ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }} ./build_antiban.sh

      - name: Verify output
        run: |
          ls -la ff_antiban.so
          file ff_antiban.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff_antiban-arm64
          path: ff_antiban.so
