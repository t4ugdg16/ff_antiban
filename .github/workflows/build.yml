name: Build ff_antiban
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r25c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Clone Dobby
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git dobby-src
          cd dobby-src
          git submodule update --init --recursive
          git log -1 --oneline

      - name: Patch Dobby asm Apple to Clang ARM64
        run: |
          cd dobby-src
          python3 - <<'PYEOF'
          import glob, re
          files = []
          for pat in ["**/*.S", "**/*.s", "**/*.asm"]:
              files.extend(glob.glob(pat, recursive=True))
          files = sorted(set(files))
          sym_re = re.compile(r'(?:cdecl\()?([A-Za-z_][A-Za-z0-9_]*)(?:\))?@PAGE(?:OFF)?')
          def repl(m):
              sym = m.group(1)
              if m.group(0).endswith('OFF'):
                  return ':lo12:' + sym
              return sym
          for f in files:
              with open(f, 'r', errors='ignore') as fh:
                  content = fh.read()
              if '@PAGE' not in content:
                  continue
              new = sym_re.sub(repl, content)
              with open(f, 'w') as fh:
                  fh.write(new)
              print("patched:", f)
          PYEOF
          echo "=== verify ==="
          grep -rn "@PAGE\|@PAGEOFF" . && echo "WARN remains" || echo "clean"
          echo "=== sample after patch ==="
          grep -n "adrp\|:lo12:" source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm | head -20

      - name: Configure Dobby
        run: |
          cd dobby-src
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build Dobby static
        run: |
          cd dobby-src/build
          make -j4 dobby_static 2>&1 | tail -200
          echo ""
          echo "=== all .a after build ==="
          find .. -name "*.a" -print
          echo "=== all .so after build ==="
          find .. -name "*.so" -print

      - name: Locate Dobby outputs
        if: always()
        run: |
          echo "=== .a ==="
          find dobby-src -name "*.a" -print
          echo "=== .so ==="
          find dobby-src -name "*.so" -print
          echo "=== dobby.h ==="
          find dobby-src -name "dobby.h" -print

      - name: Copy Dobby prebuilt
        if: always()
        run: |
          mkdir -p dobby/include
          LIB=$(find dobby-src -name "libdobby*.a" | head -n 1)
          if [ -z "$LIB" ]; then
            LIB=$(find dobby-src -name "libdobby*.so" | head -n 1)
          fi
          if [ -z "$LIB" ]; then
            echo "ERROR: no library found"
            find dobby-src -name "*.a" -print
            exit 1
          fi
          echo "picked: $LIB"
          cp "$LIB" dobby/
          INC=$(find dobby-src -name "dobby.h" | head -n 1)
          if [ -z "$INC" ]; then echo "ERROR: no dobby.h"; exit 1; fi
          cp "$INC" dobby/include/dobby.h
          find dobby -type f -print

      - name: Build ff_antiban.so
        if: always()
        run: |
          chmod +x ./build_antiban.sh
          ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }} ./build_antiban.sh 2>&1 | tail -150 || echo "build failed"

      - name: Verify output
        if: always()
        run: |
          ls -la ff_antiban.so 2>/dev/null || echo "no .so"
          file ff_antiban.so 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ff_antiban-arm64
          path: ff_antiban.so
          if-no-files-found: warn
