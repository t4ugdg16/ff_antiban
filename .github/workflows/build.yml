name: Build ff_antiban
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r25c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Clone Dobby
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git dobby-src
          cd dobby-src
          git rev-parse HEAD

      - name: Patch Dobby asm for Linux cross-compile
        run: |
          cd dobby-src
          find . -type f \( -name "*.S" -o -name "*.s" -o -name "*.asm" \) -print0 | while IFS= read -r -d '' f; do
            sed -i 's/, \([A-Za-z_][A-Za-z0-9_]*\)@PAGE/, :pg_hi21:\1/g' "$f"
            sed -i 's/, \([A-Za-z_][A-Za-z0-9_]*\)@PAGEOFF/, :lo12:\1/g' "$f"
          done
          echo "=== verify ==="
          grep -rn "pg_hi21\|lo12" source/ | head -20
          grep -rn "@PAGE\|@PAGEOFF" source/ || echo "no Apple syntax remaining"

      - name: Build Dobby arm64
        run: |
          cd dobby-src
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release
          make -j4

      - name: Copy Dobby prebuilt
        run: |
          mkdir -p dobby
          cp -r dobby-src/include dobby/include
          find dobby-src/build -name "libdobby.a" -exec cp {} dobby/libdobby.a \;
          ls -laR dobby/ | head -60

      - name: Build ff_antiban.so
        run: |
          chmod +x ./build_antiban.sh
          ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }} ./build_antiban.sh

      - name: Verify output
        run: |
          ls -la ff_antiban.so
          file ff_antiban.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff_antiban-arm64
          path: ff_antiban.so
