name: Build ff_antiban
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r25c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Clone Dobby
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git dobby-src
          cd dobby-src && git rev-parse HEAD

      - name: Patch Dobby asm Apple to GNU
        run: |
          cd dobby-src
          python3 - <<'PYEOF'
          import glob, re, sys
          files = []
          for pat in ["**/*.S", "**/*.s", "**/*.asm"]:
              files.extend(glob.glob(pat, recursive=True))
          files = list(set(files))
          print("files to scan:", len(files))
          sym_re = re.compile(r'([A-Za-z_][A-Za-z0-9_]*)@PAGE(?:OFF)?')
          patched = 0
          for f in files:
              try:
                  with open(f, 'r', errors='ignore') as fh:
                      content = fh.read()
              except Exception as e:
                  print("skip", f, e)
                  continue
              if '@PAGE' not in content:
                  continue
              def repl(m):
                  sym = m.group(1)
                  return (':lo12:' if m.group(0).endswith('OFF') else ':pg_hi21:') + sym
              new = sym_re.sub(repl, content)
              with open(f, 'w') as fh:
                  fh.write(new)
              print("patched:", f)
              patched += 1
          print("total patched:", patched)
          PYEOF
          echo "=== remaining Apple syntax ==="
          if grep -rn "@PAGE\|@PAGEOFF" . ; then
            echo "ERROR: Apple syntax still present"
            exit 1
          fi
          echo "=== patched samples ==="
          grep -rn "pg_hi21\|lo12" source/ | head -20

      - name: Build Dobby arm64
        run: |
          cd dobby-src
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release
          make -j4

      - name: Locate libdobby.a
        run: |
          echo "=== search libdobby.a ==="
          find dobby-src -name "libdobby.a" -print
          echo "=== search dobby.h ==="
          find dobby-src -name "dobby.h" -print

      - name: Copy Dobby prebuilt
        run: |
          mkdir -p dobby
          LIB=$(find dobby-src -name "libdobby.a" | head -n 1)
          if [ -z "$LIB" ]; then
            echo "ERROR: libdobby.a not found"
            exit 1
          fi
          cp "$LIB" dobby/libdobby.a
          INC=$(find dobby-src -name "dobby.h" | head -n 1)
          if [ -z "$INC" ]; then
            echo "ERROR: dobby.h not found"
            exit 1
          fi
          mkdir -p dobby/include
          cp "$INC" dobby/include/dobby.h
          echo "=== dobby/ ==="
          find dobby -type f -print
          ls -la dobby/ dobby/include/

      - name: Build ff_antiban.so
        run: |
          chmod +x ./build_antiban.sh
          ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }} ./build_antiban.sh

      - name: Verify output
        run: |
          ls -la ff_antiban.so
          file ff_antiban.so
          ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d ff_antiban.so || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff_antiban-arm64
          path: ff_antiban.so
